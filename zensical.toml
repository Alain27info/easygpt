[project]
site_name = "easygpt: build a small GPT from scratch"
site_description = "Implement and train a modern GPT-like language model (RMSNorm, RoPE, SwiGLU, AdamW, BPE) from scratch with PyTorch, on a CPU."
site_author = "Samuel Vaiter"
copyright = "Copyright &copy; 2026"
repo_url = "https://github.com/svaiter/easygpt"
repo_name = "svaiter/easygpt"

extra_javascript = [
    "javascripts/mathjax.js",
    "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

nav = [
    { "Home" = "index.md" },
    { "Setup" = "setup.md" },
    { "Part I: a character-level GPT" = [
        { "1. Characters as tokens" = "part1/data.md" },
        { "2. A bigram baseline" = "part1/bigram.md" },
        { "3. Self-attention" = "part1/attention.md" },
        { "4. Rotary position embeddings" = "part1/rope.md" },
        { "5. The Transformer" = "part1/transformer.md" },
        { "6. AdamW, schedule, clipping" = "part1/optimizer.md" },
        { "7. Training on Shakespeare" = "part1/training.md" },
        { "8. Generating text" = "part1/sampling.md" },
    ] },
    { "Part II: subwords and TinyStories" = [
        { "9. Training a BPE tokenizer" = "part2/bpe-training.md" },
        { "10. Encoding and decoding" = "part2/tokenizer.md" },
        { "11. Training on TinyStories" = "part2/tinystories.md" },
    ] },
    { "Going further" = "experiments.md" },
    { "Conclusion" = "conclusion.md" },
]

[project.theme]
features = [
    "content.code.copy",
    "content.code.annotate",
    "navigation.sections",
    "navigation.top",
    "navigation.footer",
    "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
