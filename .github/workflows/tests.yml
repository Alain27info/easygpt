name: Tests
on:
  push:
  pull_request:
jobs:
  rules:
    # the exercises fail until you solve them: check the rules of the game, and that every test file loads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run --no-group docs pytest tests/test_rules.py -q
      - run: uv run --no-group docs pytest --collect-only -q
